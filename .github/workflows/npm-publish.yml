name: Publish npm on release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org/
          cache: npm
      # Trusted publishing requires npm >=11.5.1, independently of Node's bundled npm.
      - run: npm install --global npm@11.5.1
      - run: npm ci --no-workspaces
      - run: npm run lint
      - run: npm test
      - run: npm run smoke
      - run: npm pack --dry-run --json
      - run: npm run smoke:package
      - name: Verify release tag matches package version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Publish exact version or skip if already published
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          assert.equal(pkg.name, 'sf-plugin-data360');
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(pkg.publishConfig.registry, 'https://registry.npmjs.org/');
          const registry = '--registry=https://registry.npmjs.org/';
          const spec = `${pkg.name}@${pkg.version}`;

          function npm(args) {
            const result = spawnSync('npm', args, { encoding: 'utf8' });
            if (result.error) throw result.error;
            if (result.signal) throw new Error(`npm terminated by ${result.signal}`);
            return result;
          }

          function lookup(specification, field, expected) {
            const result = npm(['view', specification, field, '--json', registry, '--prefer-online']);
            if (result.status === 0) {
              assert.equal(JSON.parse(result.stdout), expected, 'Registry returned a different identity');
              return true;
            }
            for (const output of [result.stdout, result.stderr]) {
              let data;
              try {
                data = JSON.parse(output);
              } catch {
                continue; // Plain-text diagnostics never prove registry absence.
              }
              if (data?.error?.code === 'E404') return false;
              if (data?.error) break;
            }
            throw new Error(`Registry lookup failed for ${specification}:\n${result.stdout}\n${result.stderr}`);
          }

          if (lookup(spec, 'version', pkg.version)) {
            console.log(`::notice::${spec} is already published; skipping npm publish.`);
          } else {
            if (!lookup(pkg.name, 'name', pkg.name)) {
              throw new Error('The first package publication must be performed manually by the user; hosted bootstrap is prohibited.');
            }
            const result = npm(['publish', '--json', '--no-workspaces', '--access', 'public', '--provenance', registry]);
            process.stdout.write(result.stdout);
            process.stderr.write(result.stderr);
            assert.equal(result.status, 0, `npm publish failed for ${spec}; do not retry publication automatically.`);
            console.log(`::notice::npm accepted ${spec} at ${new Date().toISOString()}; exact registry availability and provenance verification remain separate release checks.`);
          }
          NODE
